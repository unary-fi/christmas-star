name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware (build and unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zephyr

      - name: Throwaway signing key (CI builds are never published)
        run: python bootloader/mcuboot/scripts/imgtool.py keygen -k sw/signing_key.pem -t ecdsa-p256

      - name: Build release firmware
        env:
          STAR_NO_DEV_KEY: "1"
        run: west build --sysbuild -b christmas_star sw -d build/star

      - name: Build debug firmware
        env:
          STAR_NO_DEV_KEY: "1"
        run: west build --sysbuild -b christmas_star sw -d build/debug -- -DEXTRA_CONF_FILE=debug.conf

      - name: Unit tests (QEMU)
        run: west twister -T sw/tests -p qemu_cortex_m3 --inline-logs -v

      - name: Firmware sizes
        if: always()
        run: |
          for d in build/star build/debug; do
            [ -f $d/sw/zephyr/zephyr.elf ] && ~/zephyr-sdk-1.0.1/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-size $d/sw/zephyr/zephyr.elf $d/mcuboot/zephyr/zephyr.elf || true
          done

  android:
    name: Android app (build, tests, lint)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          overwrite-settings: false # Gradle 9.8 reuses Maven settings.xml mirrors
      - name: Android SDK platform 37.0
        run: |
          rm -f ~/.m2/settings.xml
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Build, unit tests and lint
        run: bash ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Lint and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/app/build/reports/

  python:
    name: Python tools and Star Studio
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pytest pillow xmodem pyserial bleak aiohttp
      - run: python -m pytest -q pc/tests sw/tools/tests

      - name: The app bundles the current firmware version
        run: |
          python - <<'EOF'
          import re, sys
          sys.path.insert(0, "pc")
          import star_protocol as sp
          v = dict(re.findall(r"(\w+) = (\d*)", open("sw/VERSION").read()))
          want = f"{v['VERSION_MAJOR']}.{v['VERSION_MINOR']}.{v['PATCHLEVEL']}"
          have = sp.image_version(open("android/app/src/main/assets/firmware/star-firmware.bin", "rb").read())
          print(f"sw/VERSION {want}, bundled in the app {have}")
          sys.exit(0 if have and have.split("+")[0] == want else 1)
          EOF
