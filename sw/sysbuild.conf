#
# Build the firmware together with the MCUboot bootloader. The firmware is
# signed with sw/signing_key.pem (ECDSA P-256, never committed; create it
# with: python bootloader/mcuboot/scripts/imgtool.py keygen -k sw/signing_key.pem -t ecdsa-p256).
# MCUboot only starts images signed with this key.

SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\${APP_DIR}/signing_key.pem"
