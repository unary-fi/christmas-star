#
# MCUboot for the Christmas Star: as small as possible (32 KB partition).
# No console, logs or drivers it does not need.

CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_GPIO=n
CONFIG_PINCTRL=y
CONFIG_SPI=n
CONFIG_I2C=n
CONFIG_ADC=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_SIZE_OPTIMIZATIONS=y
