#
# Debug variant: adds a second shell over SEGGER RTT (J-Link) so the star can
# be controlled before the Bluetooth link is paired, plus minimal logging.
#
#   west build --sysbuild -b christmas_star sw -d build/debug -- -DEXTRA_CONF_FILE=debug.conf

CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=512
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=64
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=1
CONFIG_SEGGER_RTT_MAX_NUM_DOWN_BUFFERS=1
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_PROMPT_RTT="rtt:~$ "
CONFIG_SHELL_BACKEND_RTT_BUFFER=0

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_BACKEND_RTT=n
CONFIG_SHELL_LOG_BACKEND=n
# Warnings and errors only: the info messages do not fit next to the game.
CONFIG_LOG_DEFAULT_LEVEL=2
# No Ctrl-key line editing on the RTT shell (rtt_shell.py does not need it).
CONFIG_SHELL_METAKEYS=n
# Asserts add about 16 KB, more than the 108 KB firmware slot leaves room for.
CONFIG_ASSERT=n
# Minimal logs/printk go to the RTT console, not to the Bluetooth UART.
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
